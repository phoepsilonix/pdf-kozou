[package]
name    = "pdf-kozou"
version = "1.6.5"
edition = "2021"
description = "PDF小僧 - MuPDF ベース GUI(tauri) and CLI"
license = "AGPL-3.0-only"   # または "AGPL-3.0"（SPDX準拠）
homepage = "https://github.com/phoepsilonix/pdf-kozou.git"
repository = "https://github.com/phoepsilonix/pdf-kozou.git"
authors = ["Masato TOYOSHIMA <phoepsilonix@gmail.com>"]

[lib]
name       = "pdf_kozou_lib"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "pdf-kozou"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs      = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-process = "2"
tauri-plugin-shell   = "2"

# workspace 共通
base64     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OS 標準の既知フォルダパス取得 (Linux=XDG, macOS=NSFileManager, Windows=SHGetKnownFolderPath)
dirs = "6"
which = "8"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"


# ── Linux デスクトップのみ ─────────────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
rfd     = { version = "0.17", default-features = false, features = ["gtk3"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
x11rb   = { version = "0.13", features = ["allow-unsafe-code", "randr"] }
wayland-client        = "0.31"
wayland-protocols     = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3",  features = ["client"] }

# ── Windows / macOS ───────────────────────────────────────────────────────────
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd     = { version = "0.17" }
arboard = { version = "3" }
