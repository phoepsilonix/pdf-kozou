[package]
name    = "pdf-kozou"
version = "1.8.8"
edition = "2024"
description = "PDF小僧 - MuPDF ベース GUI(tauri) and CLI"
license = "AGPL-3.0-only"   # または "AGPL-3.0"（SPDX準拠）
homepage = "https://github.com/phoepsilonix/pdf-kozou.git"
repository = "https://github.com/phoepsilonix/pdf-kozou.git"
authors = ["Masato TOYOSHIMA <phoepsilonix@gmail.com>"]

[lib]
name       = "pdf_kozou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
#crate-type = ["staticlib", "rlib"]

[[bin]]
name = "pdf-kozou"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# サイドカー(別プロセス起動)を廃止し、ライブラリとして直接リンクする。
# Android/iOS は外部プロセスの起動ができないため、これが唯一の構成。
pdf-kozou-core       = { path = "../pdf-kozou-core" }
tauri                = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs      = "2"
tauri-plugin-dialog  = "2"
tauri-plugin-process = "2"
tauri-plugin-shell   = "2"
# フォルダ単位保存 (Android SAF, ACTION_OPEN_DOCUMENT_TREE) で得た
# content:// URI 文字列を tauri_plugin_fs::FilePath::Url へ組み立てるために使う。
url                  = "2"

# workspace 共通
base64     = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
tokio      = { workspace = true }
tracing    = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OS 標準の既知フォルダパス取得 (Linux=XDG, macOS=NSFileManager, Windows=SHGetKnownFolderPath)
dirs = "6"
which = "8"

# モバイルのファイルピッカーが返す content:// / file:// URL から
# 元のファイル名(拡張子込み)を復元するために使用 (percent-decode)。
percent-encoding = "2"

# 一時ファイル名の衝突回避 (gs.rs の2段階実行での中間ファイル名など)
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"

# 2重起動対策 (ファイル関連付け経由の2回目の起動を既存インスタンスへ
# 転送し、ファイル一覧への追加のみ行う)。Android/iOS には無いモデルの
# ため、デスクトップのみ依存に加える。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"


# ── Linux デスクトップのみ ─────────────────────────────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
rfd     = { version = "0.17", default-features = false, features = ["gtk3"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
x11rb   = { version = "0.13", features = ["allow-unsafe-code", "randr"] }
wayland-client        = "0.31"
wayland-protocols     = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3",  features = ["client"] }

# ── Windows / macOS ───────────────────────────────────────────────────────────
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd     = { version = "0.17" }
arboard = { version = "3" }
