<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19221c"/>
      <stop offset="100%" stop-color="#0d1610"/>
    </linearGradient>
  </defs>
  <!-- 背景 (角丸正方形) -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- 鳥居 -->
  <rect x="72" y="138" width="368" height="30" rx="10" fill="#c84040"/>
  <rect x="92" y="178" width="328" height="20" rx="8" fill="#d04848"/>
  <!-- 笠木の反り -->
  <path d="M72 145 Q56 125 68 115 Q76 138 72 145Z" fill="#a83030"/>
  <path d="M440 145 Q456 125 444 115 Q436 138 440 145Z" fill="#a83030"/>
  <!-- 左右柱 -->
  <rect x="126" y="198" width="30" height="240" rx="8" fill="#cc4040"/>
  <rect x="356" y="198" width="30" height="240" rx="8" fill="#cc4040"/>
  <!-- PDFドキュメント (中央) -->
  <rect x="182" y="218" width="148" height="188" rx="10" fill="#f0ead8" stroke="#b89830" stroke-width="3"/>
  <!-- 折り角 -->
  <path d="M290 218 L330 258 L290 258Z" fill="#d4c070" opacity="0.8"/>
  <line x1="290" y1="218" x2="290" y2="258" stroke="#b89830" stroke-width="1.5" opacity="0.5"/>
  <!-- PDFバッジ -->
  <rect x="194" y="232" width="90" height="36" rx="8" fill="#c83030"/>
  <text x="239" y="257" text-anchor="middle" font-family="Arial Black,sans-serif"
        font-size="22" font-weight="900" fill="white">PDF</text>
  <!-- ページ線 -->
  <line x1="200" y1="292" x2="310" y2="292" stroke="#8aaa60" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="313" x2="300" y2="313" stroke="#8aaa60" stroke-width="4" stroke-linecap="round"/>
  <line x1="200" y1="334" x2="292" y2="334" stroke="#8aaa60" stroke-width="4" stroke-linecap="round"/>
  <!-- 小僧シルエット (鳥居前に立つ) -->
  <!-- 頭巾 -->
  <ellipse cx="256" cy="105" rx="34" ry="14" fill="#3d8a50"/>
  <rect x="228" y="95" width="56" height="28" rx="8" fill="#2d7040"/>
  <!-- 顔 -->
  <ellipse cx="256" cy="130" rx="26" ry="24" fill="#f0c880"/>
  <!-- 目 -->
  <circle cx="246" cy="125" r="4" fill="#1a1a1a"/>
  <circle cx="266" cy="125" r="4" fill="#1a1a1a"/>
  <!-- 笑顔 -->
  <path d="M247 138 Q256 146 265 138" stroke="#b07040" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- 縁 -->
  <rect width="512" height="512" rx="100" fill="none" stroke="#5dd68a" stroke-width="5" opacity="0.4"/>
</svg>
