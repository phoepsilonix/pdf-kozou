<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>pdf-kozou アプリアイコン(zen案)</title>
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1824"/>
      <stop offset="100%" stop-color="#130f1c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg3)"/>

  <!-- 満月 (背景光) -->
  <circle cx="256" cy="200" r="120" fill="#f0e8c0" opacity="0.07"/>
  <circle cx="256" cy="200" r="90"  fill="#f0e8c0" opacity="0.06"/>

  <!-- 和紙ドキュメント -->
  <rect x="148" y="155" width="216" height="240" rx="6" fill="#f2ead8" opacity="0.96"/>
  <!-- 縦罫線 (和紙感) -->
  <line x1="204" y1="163" x2="204" y2="390" stroke="#d8ccaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="256" y1="163" x2="256" y2="390" stroke="#d8ccaa" stroke-width="1.5" opacity="0.5"/>
  <line x1="308" y1="163" x2="308" y2="390" stroke="#d8ccaa" stroke-width="1.5" opacity="0.5"/>
  <!-- 上下の巻芯 -->
  <rect x="138" y="147" width="236" height="20" rx="10" fill="#7a5018"/>
  <rect x="138" y="383" width="236" height="20" rx="10" fill="#7a5018"/>
  <!-- PDF毛筆風 -->
  <text x="256" y="290" text-anchor="middle" font-family="serif"
        font-size="62" font-weight="bold" fill="#2a1840" letter-spacing="-2">PDF</text>
  <!-- 上段の線 -->
  <line x1="166" y1="200" x2="346" y2="200" stroke="#7a6030" stroke-width="2" opacity="0.4"/>
  <!-- 署名 -->
  <text x="256" y="365" text-anchor="middle" font-family="serif"
        font-size="20" fill="#6a4820" letter-spacing="6">小　僧</text>

  <!-- 朱印 (はんこ) -->
  <rect x="302" y="208" width="56" height="56" rx="6" fill="none" stroke="#c04040" stroke-width="3.5"/>
  <text x="330" y="248" text-anchor="middle" font-family="serif"
        font-size="28" font-weight="bold" fill="#c04040">印</text>

  <!-- 鐘 (門前の音) -->
  <g transform="translate(108,110) scale(0.55)">
    <path d="M-36,-24 Q-42,0 -42,36 L42,36 Q42,0 36,-24 Q24,-60 0,-66 Q-24,-60 -36,-24Z" fill="#7a6020"/>
    <rect x="-42" y="34" width="84" height="12" rx="5" fill="#6a5018"/>
    <path d="M-10,36 L10,36 L8,72 L-8,72Z" fill="#7a6020"/>
    <rect x="-5" y="70" width="10" height="16" rx="4" fill="#7a6020"/>
    <!-- 撞木 -->
    <line x1="-62" y1="18" x2="20" y2="18" stroke="#5a4010" stroke-width="8" stroke-linecap="round"/>
    <circle cx="-62" cy="18" r="11" fill="#7a5018"/>
  </g>

  <rect width="512" height="512" rx="100" fill="none" stroke="#c084f0" stroke-width="5" opacity="0.35"/>
</svg>
