[workspace]
members = [
    "pdf-kozou-core",
    "src-tauri",
]
resolver = "2"

# workspace 共通の依存バージョンを統一
[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
tokio      = { version = "1", features = ["full"] }
base64     = "0.22"
image      = { version = "0.25", features = ["jpeg", "png"] }
uuid       = { version = "1", features = ["v4", "fast-rng"] }
tempfile   = "3"
tracing    = "0.1"

[patch.crates-io]
#mupdf = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "3c6faa946a42b347d458eeac70374d4aa5c40506" }
#mupdf-sys = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "3c6faa946a42b347d458eeac70374d4aa5c40506" }
mupdf = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "9f8115ee1239a45bf421dd6bc431d33b72fc218c" }
mupdf-sys = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "9f8115ee1239a45bf421dd6bc431d33b72fc218c" }

[profile.release]
strip = "symbols"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
