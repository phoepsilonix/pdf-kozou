[workspace]
members = [
    "pdf-kozou-core",
    "src-tauri",
]
resolver = "2"

# workspace 共通の依存バージョンを統一
[workspace.dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "2"
anyhow     = "1"
tokio      = { version = "1", features = ["full"] }
base64     = "0.23"
image      = { version = "0.25", features = ["jpeg", "png"] }
uuid       = { version = "1", features = ["v4", "fast-rng"] }
tempfile   = "3"
tracing    = "0.1"
lopdf      = "0.44"
flate2     = "1"
# SVG 入力を正しい PDF（ソフトマスク・不透明度保持）に変換するため。
# MuPDF の SVG リーダは画像 luminance マスクを解釈できず透明部分が黒くなる。
# 0.13/0.11 で内部 usvg のバージョンが異なる。0.11(usvg 0.42) はマスク・不透明度を
# 正しく出力することを実機検証済み。0.13(usvg 0.47) は透過が washout する不具合あり。
# usvg は svg2pdf::usvg を使う（別途宣言するとバージョン二重化で型不一致になる）。
svg2pdf    = "=0.11.0"
# pdf-writer は svg2pdf 0.11 が依存するのと同じ 0.10 系に統一する
# （svg2pdf::to_chunk が返す Chunk/Ref を扱うため。バージョンがズレると型不一致）。
pdf-writer = "0.10"

[patch.crates-io]
mupdf = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "b8f85d58cc405278a1b9e8dcb1a07944ccc0194c" }
mupdf-sys = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "b8f85d58cc405278a1b9e8dcb1a07944ccc0194c" }
#mupdf = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "ecc74f78b5618b35333a8b015495a342447c4bd6" }
#mupdf-sys = { git = "https://github.com/phoepsilonix/mupdf-rs.git", rev = "ecc74f78b5618b35333a8b015495a342447c4bd6" }
# hayro: 独自パッチ入りの fork を使う (CID-keyed CFF を内包する OpenType フォントで、
# charset を引かずに CID を GID として扱うため、本来描画されない字形 (「◀」「▶」「★」など)
# が出る問題の修正)。upstream に取り込まれたら削除して crates.io 版に戻す。
# hayro の workspace 依存 (hayro-interpret, hayro-syntax など) は fork 内の path 依存として
# 解決されるので、hayro だけを差し替えれば足りる。安定したら rev で固定する。
hayro = { git = "https://github.com/phoepsilonix/hayro.git", branch = "pdf-kozou" }

[profile.release]
strip = "symbols"
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev.package."*"]
opt-level = "z"
debug = false
strip = true
codegen-units = 1
