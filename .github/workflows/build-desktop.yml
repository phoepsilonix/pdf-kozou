name: Build Desktop (Linux / Windows)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Linux x86_64
  # WebKitGTK + GTK3 のみ。xdg-desktop-portal は一切インストールしない。
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GTK3 / WebKitGTK — NO portal)
        run: |
          sudo apt-get update -y
          # ── 必須: GTK3 + WebKitGTK ──────────────────────────────────────
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libx11-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            unzip \
            p7zip-full \
            patchelf
          # ── Poppler utils (システムからコピー) ──────────────────────────
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-jpn \
            tesseract-ocr-eng
          # ── xdg-desktop-portal は明示的にインストールしない ─────────────
          echo "xdg-portal: intentionally NOT installed"
          # GTK_USE_PORTAL=0 を確認
          echo "GTK_USE_PORTAL=0" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download bundled binaries
        run: |
          chmod +x build-scripts/download-binaries.sh
          ./build-scripts/download-binaries.sh x86_64-unknown-linux-gnu

      - name: Build (release)
        env:
          GTK_USE_PORTAL: "0"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: npm run tauri build -- --target x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-kozou-linux-x86_64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage

  # ===========================================================================
  # Linux x86_64 — Wayland 環境テスト (Xvfb fallback)
  # ===========================================================================
  test-linux-wayland:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Wayland compositor (sway headless) for CI test
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libwayland-dev weston xwayland \
            poppler-utils tesseract-ocr
          echo "GTK_USE_PORTAL=0" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build (debug — faster CI)
        env:
          GTK_USE_PORTAL: "0"
          GDK_BACKEND: "wayland,x11"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: npm run tauri build -- --debug

      - name: Run unit tests (Rust)
        env:
          GTK_USE_PORTAL: "0"
        run: |
          cd src-tauri
          cargo test --lib -- --test-threads=1

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download bundled binaries (Windows)
        shell: bash
        run: |
          chmod +x build-scripts/download-binaries.sh
          ./build-scripts/download-binaries.sh x86_64-pc-windows-msvc

      - name: Build (release)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdf-kozou-windows-x86_64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
