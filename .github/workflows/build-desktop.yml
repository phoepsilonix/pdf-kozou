name: Build Desktop (Linux / Windows)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
          save_cache:
            description: 'キャッシュを保存しますか？'
            required: false
            default: 'false'
            type: boolean

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Linux x86_64
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install system dependencies (GTK3 / WebKitGTK — NO portal)
        run: |
          sudo apt-get update -y
          # ── 必須: GTK3 + WebKitGTK ──────────────────────────────────────
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libx11-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            unzip \
            p7zip-full \
            jq \
            patchelf
          # ── Poppler utils (システムからコピー) ──────────────────────────
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-jpn \
            tesseract-ocr-eng
          # ── xdg-desktop-portal は明示的にインストールしない ─────────────
          echo "xdg-portal: intentionally NOT installed"
          # GTK_USE_PORTAL=0 を確認
          echo "GTK_USE_PORTAL=0" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

          #target/release/build
          #target/release/deps
          #target/release/incremental
      - name: Restore Cache (復元のみ)
        uses: actions/cache/restore@v5.0.5
        id: cache-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-v1-
            ${{ runner.os }}-rust-
            v0-rust-pdf-kozou-v1-${{ runner.os }}

      - name: Cache Check
        run: find target/release/bundle || true

#      - name: Cache Rust target
#        uses: actions/cache@v5
#        with:
#          path: |
#            ~/.cargo/bin/
#            ~/.cargo/registry/index/
#            ~/.cargo/registry/cache/
#            ~/.cargo/git/db/
#            target/
          # 1. 完全一致を目指すキー（Cargo.lockのハッシュを含む）
#          key: ${{ runner.os }}-rust-v1-${{ hashFiles('**/Cargo.lock') }}
          # 2. 完全一致がない場合に、前方一致で探しに行くリスト
#          restore-keys: |
#            ${{ runner.os }}-rust-v1-
#            ${{ runner.os }}-rust-
#            v0-rust-pdf-kozou-v1-${{ runner.os }}

      #- name: Rust cache
      #  uses: Swatinem/rust-cache@c106961feec855ef5a58494c5a2a31c9d80429a9
      #  with:
      #    add-job-id-key: false
      #    shared-key: pdf-kozou-v1
      #    prefix-key: v0-rust
      #    save-if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}

      #- uses: denoland/setup-deno@v2
      #  with:
      #    deno-version: lts

      #- uses: oven-sh/setup-bun@v2
      #  with:
      #    bun-version-file: ".bun-version"

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Save npm cache
        uses: actions/cache/save@v5.0.5
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Build Frontend check
        run: npm run build:frontend

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build (release)
        env:
          GTK_USE_PORTAL: "0"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # linuxdeploy に除外させるライブラリを指定
          LINUXDEPLOY_EXCLUDE_LIBS: "libglib-2.0.so.0:libgobject-2.0.so.0:libgio-2.0.so.0:libgmodule-2.0.so.0:libdbus-1.so.3:libibus-1.0.so.5:libfcitx*.so:libwayland-client.so.0:libwayland-cursor.so.0:libwayland-server.so.0:libwayland-egl.so.1:libEGL.so.1:libGL.so.1:libGLX.so.0:libepoxy.so.0:libpcre2-8.so.0:libmount.so.1:libblkid.so.1"
        run: |
          . $HOME/.cargo/env
          npm run build
          #cargo tauri build

      - name: appimagetool install
        run: |
          curl -LO https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: appimage rebuild
        run: |
          APP_VER=$(jq -r ".version" package.json)
          RELEASE_DIR="target/release/bundle/"
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage
          ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage --appimage-extract
          cd squashfs-root
          # EGL/GL 系
          rm -f usr/lib/libepoxy.so.*
          rm -f usr/lib/libEGL.so.*
          rm -f usr/lib/libGL.so.*
          rm -f usr/lib/libGLX.so.*
          rm -f usr/lib/libwayland-egl.so.*
          rm -f usr/lib/libwayland-client.so.*
          rm -f usr/lib/libwayland-cursor.so.*
          rm -f usr/lib/libwayland-server.so.*
          # glib 系（システムの新しいものを使わせる）
          #rm -f usr/lib/libglib-2.0.so.*
          #rm -f usr/lib/libgobject-2.0.so.*
          #rm -f usr/lib/libgio-2.0.so.*
          #rm -f usr/lib/libgmodule-2.0.so.*
          #rm -f usr/lib/libgthread-2.0.so.*
          # glib の依存
          #rm -f usr/lib/libpcre2-8.so.*
          #rm -f usr/lib/libmount.so.*
          #rm -f usr/lib/libblkid.so.*
          #rm -f usr/lib/libffi.so.*
          # IM 関連
          rm -f usr/lib/libibus-1.0.so.*
          rm -f usr/lib/libfcitx*.so.*
          cd ..
          ARCH=x86_64 ./appimagetool-x86_64.AppImage squashfs-root PDF-Kozou_${APP_VER}_amd64.AppImage
          mv PDF-Kozou_${APP_VER}_amd64.AppImage ${RELEASE_DIR}/appimage/
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage

      - name: 7zip packages
        run: |
          APP_VER=$(jq -r ".version" package.json)
          PKG_NAME="PDF-Kozou_${APP_VER}_amd64-linux"
          PKG_FOLDER="PDF-Kozou"
          mkdir -p ${PKG_FOLDER}
          cp -a target/release/pdf-kozou ${PKG_FOLDER}
          cp -a target/release/pdf-kozou-core ${PKG_FOLDER}

          # tar.bz2
          # tar cf ${PKG_NAME}.tar ${PKG_FOLDER}/
          # bzip2 -z -9 -f --best ${PKG_NAME}.tar
          # mkdir -p target/release/bundle/tbz/
          # mv ${PKG_NAME}.tar.bz2 target/release/bundle/tbz/

          # zip
          # 7z a -mx=9 -m0=lzma:fb273:mc441:lc3:pb2 ${PKG_NAME}.zip ${PKG_FOLDER}/
          # mkdir -p target/release/bundle/zip/
          # mv ${PKG_NAME}.zip target/release/bundle/zip/

          # 7zip
          mkdir -p target/release/bundle/7z/
          7z a -mx=9 -m0=lzma:fb273:mc369:lc2:pb2 ${PKG_NAME}.7z PDF-Kozou/
          #7z a -mx=9 -m0=lzma:fb230:mc369:lc2:pb2 ${PKG_NAME}.7z ${PKG_FOLDER}/
          mv ${PKG_NAME}.7z target/release/bundle/7z/

      - name: move bundle folder
        run: |
          rm -rf ./bundle
          mv target/release/bundle ./bundle/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: |
            bundle/deb/*.deb
            bundle/rpm/*.rpm
            bundle/appimage/*.AppImage
            bundle/7z/*.7z
            #bundle/tbz/*.tar.bz2
            #bundle/zip/*.zip

      - name: Save Cache (条件付きで保存のみ実行)
        uses: actions/cache/save@v5.0.5
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install make
        run: |
          which make || true
          #choco install make
          #which make || true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
          #targets: x86_64-pc-windows-msvc

      - name: Restore Cache (復元のみ)
        uses: actions/cache/restore@v5.0.5
        id: cache-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-v1-
            ${{ runner.os }}-rust-
            v0-rust-pdf-kozou-v1-${{ runner.os }}

#      - name: Cache Rust target
#        uses: actions/cache@v5
#        with:
#          path: |
#            ~/.cargo/bin/
#            ~/.cargo/registry/index/
#            ~/.cargo/registry/cache/
#            ~/.cargo/git/db/
#            target/
          # 1. 完全一致を目指すキー（Cargo.lockのハッシュを含む）
#          key: ${{ runner.os }}-rust-v1-${{ hashFiles('**/Cargo.lock') }}
          # 2. 完全一致がない場合に、前方一致で探しに行くリスト
#          restore-keys: |
#            ${{ runner.os }}-rust-v1-
#            ${{ runner.os }}-rust-
#            v0-rust-pdf-kozou-v1-${{ runner.os }}
#          save-if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}

#      - name: Rust cache
#        uses: Swatinem/rust-cache@v2
#        with:
#          add-job-id-key: false
#          shared-key: pdf-kozou-v1
#          prefix-key: v0-rust
#          save-if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}

      - name: Locate MSVC and Set Safe Path
        shell: pwsh
        run: |
          # 1. vswhereで動的にインストール先を取得
          $installPath = vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          
          # 2. cl.exeのフルパスを特定
          $clPath = Get-ChildItem -Path "$installPath\VC\Tools\MSVC\*\bin\HostX64\x64\cl.exe" | Select-Object -First 1 -ExpandProperty FullName
          
          # 3. 短縮パス (8.3形式) に変換
          $fso = New-Object -ComObject Scripting.FileSystemObject
          $shortPath = $fso.GetFile($clPath).ShortPath
          
          # 4. 【重要】バックスラッシュをスラッシュに置換
          # これにより "C:/PROGRA~1/..." という形式になり、Bashでも安全になります
          $safePath = $shortPath.Replace('\', '/')
          
          echo "CC=$safePath" >> $env:GITHUB_ENV
          echo "CXX=$safePath" >> $env:GITHUB_ENV

      #- name: Fix Perl dependencies
      #  run: |
      #    cpan -i Pod::Usage
          # Strawberry Perl のパスが含まれないように PATH を再設定
          #export PATH="/usr/bin:/bin:/usr/local/bin:$PATH"
          #cpan -i Pod::Usage

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Get npm cache dir
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      #- uses: oven-sh/setup-bun@v2
      #  with:
      #    bun-version-file: ".bun-version"

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Save npm cache
        uses: actions/cache/save@v5.0.5
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Build Frontend check
        run: npm run build:frontend

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      #- name: Install cargo-xwin via binstall
      #  run: |
      #    cargo binstall -y cargo-xwin --force

      - name: rust default target
        run: |
          #rustup toolchain install stable-x86_64-pc-windows-msvc
          #rustup target add x86_64-pc-windows-msvc
          #rustup default stable-x86_64-pc-windows-msvc
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build (release)
        shell: bash
        env:
          OS: "mingw"
          HAVE_OBJCOPY: "no"
          CI: true
          CC: "clang"
          CXX: "clang++"
          USE_MAKE: "1"
        run: |
          #export PATH="/usr/bin:/c/Program Files/LLVM/bin:/c/Strawberry/perl/bin":"$PATH"
          #export PATH="/c/Program Files/LLVM/bin:/c/Strawberry/perl/bin":/usr/bin:/bin:"$PATH"
          #export CC=gcc
          #export CXX=g++
          #unset PERL5LIB  # Git Bash 側のライブラリを見に行かないようにする
          #unset PERLLIB  # Git Bash 側のライブラリを見に行かないようにする
          #export PERL_JSON_BACKEND=JSON::PP
          #which perl
          #which clang
          #USE_MAKE=1 CC="gcc" CXX="g++" HAVE_OBJCOPY="no" OS="mingw" cargo tauri build
          npm run build
          #cargo tauri build

      - name: Decode PFX Certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          $pfxPath = "src-tauri/gen/windows/dev.pfx"
          $pfxBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

      - name: Package and Sign MSIX
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          ./repackage_msix.ps1 -PfxPassword "${{ env.PFX_PASSWORD }}"

      - name: move bundle folder
        shell: bash
        run: |
          rm -rf ./bundle
          mv target/release/bundle ./bundle/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            bundle/nsis/*.exe
            bundle/msi/*.msi
            bundle/msi/*.msix

      - name: Save Cache (条件付きで保存のみ実行)
        uses: actions/cache/save@v5.0.5
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

  # ===========================================================================
  # macOS (Universal: x86_64 + aarch64)
  # ===========================================================================
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Restore Cache (復元のみ)
        uses: actions/cache/restore@v5.0.5
        id: cache-restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-v1-
            ${{ runner.os }}-rust-
            v0-rust-pdf-kozou-v1-${{ runner.os }}

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Restore npm cache
        id: npm-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        run: npm audit --audit-level=moderate

      - name: Save npm cache
        uses: actions/cache/save@v5.0.5
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}

      - name: Build Frontend check
        run: npm run build:frontend

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build (release) - 署名なし
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""   # 空で署名をスキップ
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: |
          . $HOME/.cargo/env
          #npm run build -- --no-bundle   # まずバイナリだけビルド
          # または署名を明示的に無効化
          npm run build -- --target universal-apple-darwin --no-bundle

      - name: Create simple DMG (署名なし)
        run: |
          APP_VER=$(jq -r ".version" package.json)
          cd target/release/bundle
          # .appをDMGにまとめる（簡易版）
          mkdir -p unsigned
          cp -R *.app unsigned/ || true
          # hdiutilでDMG作成（署名なし）
          hdiutil create -volname "PDF-Kozou ${APP_VER}" \
            -srcfolder unsigned \
            -ov -format UDZO \
            "PDF-Kozou_${APP_VER}_universal.dmg"

      - name: move bundle folder
        run: |
          rm -rf ./bundle
          mkdir -p bundle/macos
          mv target/release/bundle/*.dmg bundle/macos/ 2>/dev/null || true
          mv target/release/bundle/*.app bundle/macos/ 2>/dev/null || true
          mv target/release/pdf-kozou* bundle/macos/ 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: bundle/macos/

      - name: Save Cache (条件付きで保存のみ実行)
        uses: actions/cache/save@v5.0.5
        if: ${{ (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop') && github.event.inputs.save_cache == 'true' }}
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-rust-${{ hashFiles('**/Cargo.lock') }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos] # 両方の完了を待つ
    if: startsWith(github.ref, 'refs/tags/') # タグ時のみ
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./dist # すべての成果物を dist フォルダに集約

      - name: Release to GitHub
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./dist/linux-artifacts/**/*.AppImage
            ./dist/linux-artifacts/**/*.deb
            ./dist/linux-artifacts/**/*.rpm
            ./dist/linux-artifacts/**/*.7z
            ./dist/windows-artifacts/**/*.exe
            ./dist/windows-artifacts/**/*.msi
            ./dist/windows-artifacts/**/*.msix
            ./dist/macos-artifacts/**/*.dmg
            ./dist/macos-artifacts/**/*.app
            ./dist/macos-artifacts/**/*.zip
          draft: false
          prerelease: ${{ contains(github.ref_name, 'pre') }}
