name: Build Desktop (Linux / Windows)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Linux x86_64
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GTK3 / WebKitGTK — NO portal)
        run: |
          sudo apt-get update -y
          # ── 必須: GTK3 + WebKitGTK ──────────────────────────────────────
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libx11-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            unzip \
            p7zip-full \
            jq \
            patchelf
          # ── Poppler utils (システムからコピー) ──────────────────────────
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-jpn \
            tesseract-ocr-eng
          # ── xdg-desktop-portal は明示的にインストールしない ─────────────
          echo "xdg-portal: intentionally NOT installed"
          # GTK_USE_PORTAL=0 を確認
          echo "GTK_USE_PORTAL=0" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build (release)
        env:
          GTK_USE_PORTAL: "0"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: |
          . $HOME/.cargo/env
          cargo tauri build

      - name: appimagetool install
        run: |
          curl -LO https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: appimage rebuild
        run: |
          APP_VER=$(jq -r ".version" package.json)
          RELEASE_DIR="target/release/bundle/"
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage
          ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage --appimage-extract
          # Fixed for WAYLAND Environment
          cd squashfs-root
          rm -f usr/lib/libwayland-*.so.*
          rm -f usr/lib/libepoxy.so.*
          rm -f usr/lib/libEGL.so.*
          rm -f usr/lib/libGL.so.*
          rm -f usr/lib/libGLX.so.*
          cd ..
          ARCH=x86_64 ./appimagetool-x86_64.AppImage squashfs-root PDF-Kozou_${APP_VER}_amd64.AppImage
          mv PDF-Kozou_${APP_VER}_amd64.AppImage ${RELEASE_DIR}/appimage/
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install make
        run: choco install make

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      #- name: Install cargo-xwin via binstall
      #  run: |
      #    cargo binstall -y cargo-xwin --force

      - name: rust default target
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build (release)
        env:
          OS: "mingw"
          HAVE_OBJCOPY: "no"
          USE_MAKE: "1"
        run: |
          cargo tauri build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows] # 両方の完了を待つ
    if: startsWith(github.ref, 'refs/tags/') # タグ時のみ
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist # すべての成果物を dist フォルダに集約

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/linux-artifacts/**/*.AppImage
            ./dist/linux-artifacts/**/*.deb
            ./dist/linux-artifacts/**/*.rpm
            ./dist/windows-artifacts/**/*.exe
            ./dist/windows-artifacts/**/*.msi
          draft: false
          prerelease: false
