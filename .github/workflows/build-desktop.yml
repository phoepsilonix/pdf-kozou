name: Build Desktop (Linux / Windows)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Linux x86_64
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GTK3 / WebKitGTK — NO portal)
        run: |
          sudo apt-get update -y
          # ── 必須: GTK3 + WebKitGTK ──────────────────────────────────────
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libx11-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            unzip \
            p7zip-full \
            jq \
            patchelf
          # ── Poppler utils (システムからコピー) ──────────────────────────
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-jpn \
            tesseract-ocr-eng
          # ── xdg-desktop-portal は明示的にインストールしない ─────────────
          echo "xdg-portal: intentionally NOT installed"
          # GTK_USE_PORTAL=0 を確認
          echo "GTK_USE_PORTAL=0" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pdf-kozou-v1"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build (release)
        env:
          GTK_USE_PORTAL: "0"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # linuxdeploy に除外させるライブラリを指定
          LINUXDEPLOY_EXCLUDE_LIBS: "libglib-2.0.so.0:libgobject-2.0.so.0:libgio-2.0.so.0:libgmodule-2.0.so.0:libdbus-1.so.3:libibus-1.0.so.5:libfcitx*.so:libwayland-client.so.0:libwayland-cursor.so.0:libwayland-server.so.0:libwayland-egl.so.1:libEGL.so.1:libGL.so.1:libGLX.so.0:libepoxy.so.0:libpcre2-8.so.0:libmount.so.1:libblkid.so.1"
        run: |
          . $HOME/.cargo/env
          cargo tauri build

      - name: appimagetool install
        run: |
          curl -LO https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: appimage rebuild
        run: |
          APP_VER=$(jq -r ".version" package.json)
          RELEASE_DIR="target/release/bundle/"
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage
          ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage --appimage-extract
          cd squashfs-root
          # EGL/GL 系
          rm -f usr/lib/libepoxy.so.*
          rm -f usr/lib/libEGL.so.*
          rm -f usr/lib/libGL.so.*
          rm -f usr/lib/libGLX.so.*
          rm -f usr/lib/libwayland-egl.so.*
          rm -f usr/lib/libwayland-client.so.*
          rm -f usr/lib/libwayland-cursor.so.*
          rm -f usr/lib/libwayland-server.so.*
          # glib 系（システムの新しいものを使わせる）
          #rm -f usr/lib/libglib-2.0.so.*
          #rm -f usr/lib/libgobject-2.0.so.*
          #rm -f usr/lib/libgio-2.0.so.*
          #rm -f usr/lib/libgmodule-2.0.so.*
          #rm -f usr/lib/libgthread-2.0.so.*
          # glib の依存
          #rm -f usr/lib/libpcre2-8.so.*
          #rm -f usr/lib/libmount.so.*
          #rm -f usr/lib/libblkid.so.*
          #rm -f usr/lib/libffi.so.*
          # IM 関連
          rm -f usr/lib/libibus-1.0.so.*
          rm -f usr/lib/libfcitx*.so.*
          cd ..
          ARCH=x86_64 ./appimagetool-x86_64.AppImage squashfs-root PDF-Kozou_${APP_VER}_amd64.AppImage
          mv PDF-Kozou_${APP_VER}_amd64.AppImage ${RELEASE_DIR}/appimage/
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu
          #targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "pdf-kozou-v1"
      
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install npm dependencies
        run: npm ci
      - name: Build Frontend
        run: npm run build

      - name: Install make
        run: choco install make

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      #- name: Install cargo-xwin via binstall
      #  run: |
      #    cargo binstall -y cargo-xwin --force

      - name: rust default target
        run: |
          #rustup toolchain install stable-x86_64-pc-windows-msvc
          rustup toolchain install stable-x86_64-pc-windows-gnu
          #rustup target add x86_64-pc-windows-msvc
          #rustup default stable-x86_64-pc-windows-msvc
          rustup target add x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build (release)
        shell: bash
        env:
          OS: "mingw"
          HAVE_OBJCOPY: "no"
          USE_MAKE: "1"
          CI: true
        run: |
          cargo tauri build

      - name: Decode PFX Certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.MSIX_PFX_BASE64 }}
        run: |
          $pfxPath = "src-tauri/gen/windows/dev.pfx"
          $pfxBytes = [System.Convert]::FromBase64String($env:PFX_BASE64)
          [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)

        # CI環境上で動的に bundle.config.json をセットアップ
      - name: Configure bundle.config.json for Signing
        shell: pwsh
        env:
          PFX_PASSWORD: ${{ secrets.MSIX_PFX_PASSWORD }}
        run: |
          $configPath = "src-tauri/gen/windows/bundle.config.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.signing.pfx = "src-tauri/gen/windows/dev.pfx"
          $config.signing.pfxPassword = $env:PFX_PASSWORD
          # MakePri を有効にする（透過アイコン等に必須）
          $config | Add-Member -MemberType NoteProperty -Name "resourceIndex" -Value @{ enabled = $true } -Force
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath

      - name: Install msixbundle-cli
        shell: bash
        run: cargo install msixbundle-cli || true
        continue-on-error: true

     # MSIX バンドルのビルド（--arch でマルチアーキ出力・バンドル化を指定）
      - name: Build MSIX bundle
        env:
          OS: "mingw"
          HAVE_OBJCOPY: "no"
          USE_MAKE: "1"
          CI: true
        run: |
          npm run tauri:windows:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msix
            target/release/msix/*.msixbundle

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows] # 両方の完了を待つ
    if: startsWith(github.ref, 'refs/tags/') # タグ時のみ
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist # すべての成果物を dist フォルダに集約

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/linux-artifacts/**/*.AppImage
            ./dist/linux-artifacts/**/*.deb
            ./dist/linux-artifacts/**/*.rpm
            ./dist/windows-artifacts/**/*.exe
            ./dist/windows-artifacts/**/*.msi
            ./dist/windows-artifacts/**/*.msix
          draft: false
          prerelease: false
