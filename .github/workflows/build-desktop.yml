name: Build Desktop (Linux / Windows)

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Linux x86_64
  # ===========================================================================
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (GTK3 / WebKitGTK — NO portal)
        run: |
          sudo apt-get update -y
          # ── 必須: GTK3 + WebKitGTK ──────────────────────────────────────
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libglib2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libgdk-pixbuf-2.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libx11-dev \
            libxrandr-dev \
            libxcomposite-dev \
            libxdamage-dev \
            libxfixes-dev \
            libwayland-dev \
            libwayland-egl-backend-dev \
            pkg-config \
            build-essential \
            curl \
            wget \
            unzip \
            p7zip-full \
            jq \
            patchelf
          # ── Poppler utils (システムからコピー) ──────────────────────────
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-jpn \
            tesseract-ocr-eng
          # ── xdg-desktop-portal は明示的にインストールしない ─────────────
          echo "xdg-portal: intentionally NOT installed"
          # GTK_USE_PORTAL=0 を確認
          echo "GTK_USE_PORTAL=0" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ""

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build (release)
        env:
          GTK_USE_PORTAL: "0"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          # linuxdeploy に除外させるライブラリを指定
          LINUXDEPLOY_EXCLUDE_LIBS: "libglib-2.0.so.0:libgobject-2.0.so.0:libgio-2.0.so.0:libgmodule-2.0.so.0:libdbus-1.so.3:libibus-1.0.so.5:libfcitx*.so:libwayland-client.so.0:libwayland-cursor.so.0:libwayland-server.so.0:libwayland-egl.so.1:libEGL.so.1:libGL.so.1:libGLX.so.0:libepoxy.so.0:libpcre2-8.so.0:libmount.so.1:libblkid.so.1"
        run: |
          . $HOME/.cargo/env
          cargo tauri build

      - name: appimagetool install
        run: |
          curl -LO https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage

      - name: appimage rebuild
        run: |
          APP_VER=$(jq -r ".version" package.json)
          RELEASE_DIR="target/release/bundle/"
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage
          ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage --appimage-extract
          cd squashfs-root
          # EGL/GL 系
          rm -f usr/lib/libepoxy.so.*
          rm -f usr/lib/libEGL.so.*
          rm -f usr/lib/libGL.so.*
          rm -f usr/lib/libGLX.so.*
          rm -f usr/lib/libwayland-egl.so.*
          rm -f usr/lib/libwayland-client.so.*
          rm -f usr/lib/libwayland-cursor.so.*
          rm -f usr/lib/libwayland-server.so.*
          # glib 系（システムの新しいものを使わせる）
          #rm -f usr/lib/libglib-2.0.so.*
          #rm -f usr/lib/libgobject-2.0.so.*
          #rm -f usr/lib/libgio-2.0.so.*
          #rm -f usr/lib/libgmodule-2.0.so.*
          #rm -f usr/lib/libgthread-2.0.so.*
          # glib の依存
          #rm -f usr/lib/libpcre2-8.so.*
          #rm -f usr/lib/libmount.so.*
          #rm -f usr/lib/libblkid.so.*
          #rm -f usr/lib/libffi.so.*
          # IM 関連
          rm -f usr/lib/libibus-1.0.so.*
          rm -f usr/lib/libfcitx*.so.*
          cd ..
          ARCH=x86_64 ./appimagetool-x86_64.AppImage squashfs-root PDF-Kozou_${APP_VER}_amd64.AppImage
          mv PDF-Kozou_${APP_VER}_amd64.AppImage ${RELEASE_DIR}/appimage/
          chmod +x ${RELEASE_DIR}/appimage/PDF-Kozou_${APP_VER}_amd64.AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage

  # ===========================================================================
  # Windows x86_64
  # ===========================================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ""
      
      #- name: Setup pnpm
      #  uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install make
        run: choco install make

      - name: Install tauri-cli via binstall
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli -y --force
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      #- name: Install cargo-xwin via binstall
      #  run: |
      #    cargo binstall -y cargo-xwin --force

      - name: rust default target
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu
          rustup target add x86_64-pc-windows-gnu
          rustup default stable-x86_64-pc-windows-gnu

      - name: Build (release)
        env:
          OS: "mingw"
          HAVE_OBJCOPY: "no"
          USE_MAKE: "1"
          CI: true
        run: |
          cargo tauri build

      - name: Debug Directory Structure
        shell: pwsh
        run: |
          Get-ChildItem -Recurse "target/release/bundle/msi" | Select-Object FullName

      - name: Repackage MSI to MSIX
        shell: pwsh
        run: |
          $makeAppx = "C:\Program Files (x86)\Windows Kits\10\App Build\makeappx.exe"
          $signtool = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\signtool.exe"

          # 絶対パスを取得
          $basePath = Resolve-Path "target/release/bundle/msi"

          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=1CB57BC7-DF63-47F3-83C8-6A33A692A2CF" -KeyUsage DigitalSignature -FriendlyName "StoreCert" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")

          Get-ChildItem -Path $basePath -Directory | ForEach-Object {
              $lang = $_.Name
              $sourcePath = $_.FullName
              $targetMsix = Join-Path $basePath "PDF-Kozou_$($lang).msix"
              $manifestPath = Join-Path $sourcePath "AppxManifest.xml"

              Write-Host "Creating Manifest for $lang..."

              # ヒアドキュメントを避け、確実に1つの文字列として結合
              $xml = "<?xml version=`"1.0`" encoding=`"utf-8`"?>`n"
              $xml += "<Package xmlns=`"http://schemas.microsoft.com/appx/manifest/foundation/windows10`" xmlns:uap=`"http://schemas.microsoft.com/appx/manifest/uap/windows10`" xmlns:rescap=`"http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities`" IgnorableNamespaces=`"uap rescap`">`n"
              $xml += "  <Identity Name=`"phoepsilonix.PDF-Kozou`" Publisher=`"CN=1CB57BC7-DF63-47F3-83C8-6A33A692A2CF`" Version=`"1.4.0.0`" ProcessorArchitecture=`"x64`" />`n"
              $xml += "  <Properties><DisplayName>PDF-Kozou</DisplayName><PublisherDisplayName>phoepsilonix</PublisherDisplayName><Logo>Assets\StoreLogo.png</Logo></Properties>`n"
              $xml += "  <Resources><Resource Language=`"$lang`" /></Resources>`n"
              $xml += "  <Applications><Application Id=`"App`" Executable=`"pdf-kozou.exe`" EntryPoint=`"Windows.FullTrustApplication`"><uap:VisualElements DisplayName=`"PDF-Kozou`" Description=`"PDF-Kozou`" BackgroundColor=`"transparent`" Square150x150Logo=`"Assets\Square150x150Logo.png`" Square44x44Logo=`"Assets\Square44x44Logo.png`"><uap:DefaultTile Wide310x150Logo=`"Assets\Wide310x150Logo.png`" /></uap:VisualElements></Application></Applications>`n"
              $xml += "  <Capabilities><rescap:Capability Name=`"runFullTrust`" /></Capabilities>`n"
              $xml += "</Package>"

              [System.IO.File]::WriteAllText($manifestPath, $xml)

              Write-Host "Packing $targetMsix..."
              & $makeAppx pack /d "$sourcePath" /p "$targetMsix" /v

              Write-Host "Signing $targetMsix..."
              & $signtool sign /fd SHA256 /a /f Cert:\CurrentUser\My\$($cert.Thumbprint) "$targetMsix"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/msi/*.msix

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows] # 両方の完了を待つ
    if: startsWith(github.ref, 'refs/tags/') # タグ時のみ
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist # すべての成果物を dist フォルダに集約

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./dist/linux-artifacts/**/*.AppImage
            ./dist/linux-artifacts/**/*.deb
            ./dist/linux-artifacts/**/*.rpm
            ./dist/windows-artifacts/**/*.exe
            ./dist/windows-artifacts/**/*.msi
            ./dist/windows-artifacts/**/*.msix
          draft: false
          prerelease: false
