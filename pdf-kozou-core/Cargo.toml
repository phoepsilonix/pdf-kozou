[package]
name    = "pdf-kozou-core"
version = "1.7.17"
edition = "2024"
description = "PDF処理エンジン — MuPDF ベース CLI / sidecar"
license = "AGPL-3.0-only"   # または "AGPL-3.0"（SPDX準拠）
homepage = "https://github.com/phoepsilonix/pdf-kozou.git"
repository = "https://github.com/phoepsilonix/pdf-kozou.git"
authors = ["Masato TOYOSHIMA <phoepsilonix@gmail.com>"]

[[bin]]
name = "pdf-kozou-core"
path = "src/main.rs"

[lib]
name      = "pdf_kozou_core"
crate-type = ["rlib", "staticlib"]

[package.metadata.cross.target.x86_64-pc-windows-gnu]
# MinGW 専用：DLL エクスポート抑制
rustflags = [
    "-C", "link-arg=-Wl,--disable-auto-image-base",
]

[dependencies]
# PDF処理 — MuPDF 静的リンク (依存はここだけ)
# 0.6.0: MuPDF 1.27.0 ベース、GraftMap/insert_page API 整備済み
#mupdf     = { version = "0.8", default-features = false, features = ["js", "xps", "svg", "cbz", "img", "html", "epub","system-fonts"] }
#mupdf-sys = "0.8"
mupdf     = { version = "0.8", default-features = false, features = ["js", "xps", "svg", "cbz", "img", "html", "epub","system-fonts", "base14-fonts"] }
mupdf-sys = { version = "0.8", default-features = false, features = ["zerocopy"] }

# workspace 共通
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
base64     = { workspace = true }
lopdf      = { workspace = true }
image      = { workspace = true }
uuid       = { workspace = true }
tempfile   = { workspace = true }
tracing    = { workspace = true }

# SVG → PDF 変換（svg2pdf）。usvg は svg2pdf::usvg を使うため別途依存は不要。
svg2pdf    = { workspace = true }
# svg2pdf::to_chunk で SVG を XObject 化し目標ページサイズに配置するために使用。
pdf-writer = { workspace = true }

# CLI 引数
clap = { version = "4", features = ["derive"] }

# ZIP ファイル読み込み（DOCX/XLSX/PPTX のメタデータ取得用）
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
# mupdf_safe.c のコンパイルに使う
cc = "1"

